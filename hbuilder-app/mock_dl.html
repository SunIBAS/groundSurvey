<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>假设在下载</title>
    <style>
        body {
            background: #50a6ff;
        }
        .download_ui {
            position: absolute;
            z-index: 100;
            background: #80808020;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .download_ui_content {
            width: 100vw;
            padding: 20% 20px;
            box-sizing: border-box;
            height: 100vh;
        }
        .download_ui_content_img {
            width: 80%;
            padding: 0 10%;
        }
        .download_ui_content_img_mask {
            width: 100%;
            height: 50%;
            display: block;
            position: absolute;
            background: #f0f8ff5c;
            bottom: 0;
        }
        .download_ui_content_img_num {
            width: 100%;
            position: absolute;
            bottom: 0;
            text-align: center;
            font-size: 100px;
            height: 100%;
            display: table;
        }
        .download_ui_content_img_num span {
            display: table-cell;
            vertical-align: middle;
        }
        .download_btn {
            font-size: 20px;
            background: #2196f3d4;
            padding: 5px;
            border-radius: 5px;
            margin: 5px 0;
            box-shadow: 0px 0px 1px 1px #d3d1d1;
        }
        .download_disable_btn {
            background: gray;
        }
        .downloading_text {
            font-size: 20px;
            text-align: center;
            margin: 8px 0;
            background: #f0f8ff33;
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="download_ui">
        <div class="download_ui_content">
            <div style="text-align: right;">
                <span class="download_btn">关闭 / Close</span>
            </div>
            <div style="width: 100%;position: relative;">
                <div class="download_ui_content_img_mask"></div>
                <div class="download_ui_content_img_num">
                    <span>
                        20%
                    </span>
                </div>
                <img src="./img/MAP.png" class="download_ui_content_img" alt="">
            </div>
            <div style="margin-top: 50px;">
                <div class="start_download">
                    <div style="width: 100%;text-align: center;" class="download_btn">下载/Download</div>
                </div>
                <div class="over_download">
                    <div style="width: 100%;text-align: center;" class="download_btn">已下载/Downloaded</div>
                </div>
                <div class="downloading" style="display: flex;">
                    <div class="download_btn" style="flex: 1;text-align: center;margin: 0 5px 0 0px;">继续下载<br/>Continue</div>
                    <div class="download_btn" style="flex: 1;text-align: center;margin: 0 5px 0 5px;">暂停<br/>Pause</div>
                    <div class="download_btn" style="flex: 1;text-align: center;margin: 0 0px 0 5px;">中止<br/>Abort</div>
                </div>
                <div class="downloading">
                    <div class="downloading_text">正在下载/Downloading</div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>

</script>
</html>
