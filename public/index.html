<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <script src="./js/config.js"></script>
    <script src="./lang.js"></script>
    <title><%= htmlWebpackPlugin.options.title %></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        #map {
            width: 100%;
            height: 100vh;
        }
        @supports (-webkit-touch-callout: none) {
            #map {
                min-height: -webkit-fill-available;
            }
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .apple-debug {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 20px;
            height: 20px;
            background: #3f51b5;
            z-index: 100000000;
        }
    </style>
</head>
<body>
<noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
</noscript>
<div class="apple-debug"></div>
<div id="app"></div>
<!-- built files will be auto injected -->
<script>
    function reload_apple() {
        function appendScript(src,suc) {
            let sc1 = document.createElement('script');
            sc1.src = src;
            sc1.onload = suc;
            document.body.append(sc1);
        };
        document.body.innerHTML = `<div class="apple-debug"></div><div id="app"></div>`;
        // document.getElementsByClassName('background')[0].remove();
        // let sc = document.getElementsByTagName('script');
        // sc[sc.length - 1].remove();
        // sc[sc.length - 1].remove();
        appendScript(`js/chunk-vendors.js?${new Date().getTime()}`,() => {
            appendScript(`js/index.js?${new Date().getTime()}`,()=>{
                setReloadBtn();
                alert('over');
            })
        });
    }
    function setReloadBtn() {
        let ad = document.getElementsByClassName('apple-debug')[0];
        if (location.hostname.includes('172.20.109')) {
            ad.onclick = function () {
                reload_apple();
            }
        } else {
            ad.style.display = 'none';
        }
    };
    window.onload = setReloadBtn;
</script>
</body>
</html>
