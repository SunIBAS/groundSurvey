        body {
            overflow: hidden;
            padding: 0;
            margin: 0;
            border: none;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        @supports (-webkit-touch-callout: none) {
            #map {
                min-height: -webkit-fill-available;
            }
        }

<body>
<div id="map"></div>
<script>
    window.map = null;
    // https://account.mapbox.com/access-tokens
    window.onload = function () {
        leafletAPI.initMap(L,'map',[43.83593960164886, 89.83942252842337],10);
        leafletAPI.changeBaseMap('mapbox');
        window.map = leafletAPI.get_map();
        window.leafletAPI = leafletAPI;
    }
</script>
